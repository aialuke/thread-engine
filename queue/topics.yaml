    drafted_note: >-
      Drafted 24 Sep with three swaps: Postman Team → Bruno, Navicat Premium → Beekeeper Studio,
      ngrok Pay-as-you-go → Cloudflare Tunnel. Docker Desktop and DataGrip cut (both free for most
      of the audience; CLAIMS.md). Shout-out @use_bruno, handle checked 24 Sep.
    note: >-
      Session draft: Postman → Bruno (API collections as files in the repo); Navicat / DataGrip →
      Beekeeper Studio (SQL client for Postgres, MySQL, SQLite); Ngrok → Cloudflare Tunnels (share
      localhost on a real hostname). Fixes: one paid tool per row (Navicat or DataGrip, whichever
      X talks about). Postman has a free plan: name the paid tier or cut. The ngrok row needs
      rewriting or cutting: ngrok's free plan already has one permanent *.ngrok-free.app domain,
      with a warning page, 20k requests and 1 GB a month (ngrok docs, 24 Sep); Cloudflare's version
      needs your own domain on Cloudflare. Bruno's paid Git UI and extras go in REPLIES.md.
      Shout-out: @use_bruno, without the session's "they still post the changelog".

