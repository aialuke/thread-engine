id: "CTL-TODAY-PRIMARY"
label: "primaryLabel, by state (main_script.js:350-374; missed = now > slot+1h; late = now > slot; isEarly = more than 30 min before the slot): - stage 2, missed: \"Read and approve\". Headline \"The HH:MM slot has passed.\". Hint \"Approving posts nothing. Then move it to {nextLabel}.\" - stage 2: \"Read and approve\". Headline \"Today's post needs your read.\" | \"Tomorrow's post needs your read.\" | \"Your next post needs your read.\". Hint \"Change anything first. Edits teach the loop what you prefer.\" - stage 3, missed: \"Move it to {nextLabel}\" (for example \"Move it to tomorrow, 06:00\"). Hint \"Your approval stays. Nothing is posted for you.\" - stage 3, isEarly: \"Remind me at {slot−10 min}\" | \"Reminder set for {slot−10 min}\". Headline \"Approved, and ready for HH:MM today|tomorrow|on {Ddd D Mon}.\". Hint \"A nudge 10 minutes before. Nothing is posted for you.\" | \"Tap to turn it off. Nothing is posted for you.\" - stage 3, otherwise: \"Start posting\". Headline \"Time to post.\" (late) | \"Almost time to post.\". Hint \"Final checks first. You press Post on X.\" - stage 4: \"Back to posting\". Headline \"You're in the middle of posting.\". Hint \"The shout-out is still to come.\" - stage 5: \"See results\". Headline \"Posted. Stay close for the first hour.\". Hint \"The first full read comes with the daily check on {Ddd D Mon} at 20:00.\" (firstRead, 234: first 20:00 at least 36 h after posting)"
where: "Main.dc.html:85 (cj 77), Mac.dc.html:114 (cj 106)"
binding: "onClick=primaryAction, one of: - readCards (347): iPhone go('post'); Mac focusCards (343-346): screen 'today', scrolls `[data-te-cards]` (Mac:200 h2, tabindex -1) into view and focuses it - moveSlot (332): setState({slotMs: nextSlot(now)}), the next 06:00 at least 30 min away (232) - remind toggle (364): setState({remind: !s.remind}). This is the same key as Settings → Notifications → \"Before a post\" (main_script.js:148, 669-671) - startReady (348): returns if thinking or drafting; else setState({screen:'today', thinking:'ready', refused:null}). The ready line (Main:81 / Mac:110) runs, then doneReady (501-508) - go('ready') (370): screen 'ready' - go('results') (373)"
shown_when: "showPrimary = s.thinking !== 'ready' (499); the working line replaces it while checks run"
enabled_when: "disabled={{primaryDisabled}}, true only for \"Start posting\" while busy (368); opacity 0.45 (497)"
purpose: "D2 and D15: one button per step of the post's life. D35: \"Remind me\" on Today switches the first notification. Review #11 (missed slot), #15 (Mac focus)"
real_wiring: "- Read and approve → LOCAL nav to SCR-POST - Move it to … → NO-CMD: rewrite this row's `post_at` in queue/topics.yaml (an agent-written file, not loop state). The next slot should come from the posting-slot rule (22:00–23:00 or 05:00–07:00, Tue night to Fri morning; Weights, main_script.js:96), not a fixed 06:00 (G7) - Remind me → LOCAL setting `remind` + a scheduled push at post_at−10 min (D35; needs a poller and push, C4; web push on iPhone only works for a home-screen app) - Start posting → CMD-READY (`post_thread.py <folder>`). Exit 2 → back to approve; exit 1 → SCR-POSTING refused with each REFUSED line in plain words (ready SKILL 2); exit 0 → SCR-POSTING steps, stage 4 - Back to posting / See results → LOCAL nav"
states: "running (the ready working line); success → SCR-POSTING; refused → SCR-POSTING alert; approval stale → the mock silently returns (504, G16). Real also needs: \"human gate\" (exit 2) and \"Mac unreachable\""
mock_only: "the slot comes from TARGET (162); nextSlot only knows 06:00; the reminder never fires"
a11y: "the label changes with state. The Remind toggle has no aria-pressed (G8). After Start posting the button unmounts and focus is dropped (G32). Mac focusCards moves focus to the cards heading"
