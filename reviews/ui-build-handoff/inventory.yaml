binding: "- onPointerDown=holdStart (main_script.js:382-389): a setInterval every 40 ms adds 4 to s.hold; at 100 (about 1.0 s) it calls approveNow - onPointerUp / onPointerLeave / onPointerCancel / onLostPointerCapture / onBlur = holdEnd → cancelHold (258): clears the timer and sets hold 0. visibilitychange (hidden) also cancels (249) - onKeyDown=holdKeyDown (539): Space/Enter without repeat → preventDefault, holdStart. onKeyUp=holdKeyUp (540) → holdEnd - approveNow (377-381): setState({hold:0, stage:3, approvedAt:hhmm(now), approvedText: cardBase(+take), editedAfter:false, savedNote:false}); focusButton(['Start posting','Move it to','Edit a card'])"
