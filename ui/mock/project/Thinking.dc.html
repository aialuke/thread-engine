<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Working state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#17160F}
.te-think{color:var(--ink,#17160F)}
.te-shimmer{background:linear-gradient(90deg,var(--text2,#4A473F) 0%,var(--text2,#4A473F) 38%,var(--shimmer-hi,#C9C3B4) 50%,var(--text2,#4A473F) 62%,var(--text2,#4A473F) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:te-sh 2.2s linear infinite}
@keyframes te-sh{0%{background-position:100% 0}100%{background-position:0% 0}}
.te-spin{animation:te-spin 1.4s linear infinite}
@keyframes te-spin{to{transform:rotate(360deg)}}
.te-bob{animation:te-bob 1.2s ease-in-out infinite}
@keyframes te-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.te-sweep{animation:te-sweep 1.6s ease-in-out infinite;transform-box:fill-box}
@keyframes te-sweep{0%,100%{transform:translate(-2px,0)}50%{transform:translate(2px,1px)}}
.te-write{animation:te-write .9s ease-in-out infinite;transform-origin:20% 80%}
@keyframes te-write{0%,100%{transform:rotate(-6deg) translateX(-1px)}50%{transform:rotate(5deg) translateX(2px)}}
.te-bar1,.te-bar2,.te-bar3{transform-box:fill-box;transform-origin:50% 100%;animation:te-bar 1.1s ease-in-out infinite}
.te-bar2{animation-delay:.18s}
.te-bar3{animation-delay:.36s}
@keyframes te-bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.te-pulse{animation:te-pulse 1.3s ease-in-out infinite}
@keyframes te-pulse{0%,100%{opacity:.4}50%{opacity:1}}
.te-hand{transform-origin:12px 12px;animation:te-spin 2.4s linear infinite}
@media (prefers-reduced-motion: reduce){.te-shimmer,.te-spin,.te-bob,.te-sweep,.te-write,.te-bar1,.te-bar2,.te-bar3,.te-pulse,.te-hand{animation:none}.te-shimmer{background:none;color:var(--text2,#4A473F)}}
</style>
</helmet>
<div class="te-think" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 4px 0">
<sc-for list="{{done}}" as="d" hint-placeholder-count="0">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--faint, #6E6A5F)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin: 0 2px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span>{{d.text}}</span>
</div>
</sc-for>
<sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 28px; color: var(--blue, #2340A8)" role="status" aria-live="polite">
<span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{isSync}}" hint-placeholder-val="{{ false }}">
<svg class="te-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.6"></path><path d="M4 12a8 8 0 0 1 13.7-5.6"></path><path d="M17.7 3v3.6h-3.6"></path><path d="M6.3 21v-3.6h3.6"></path></svg>
</sc-if>
<sc-if value="{{isRead}}" hint-placeholder-val="{{ true }}">
<svg class="te-bob" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5z"></path><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"></path></svg>
</sc-if>
<sc-if value="{{isSearch}}" hint-placeholder-val="{{ false }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="te-sweep"><circle cx="10.5" cy="10.5" r="5.5"></circle><path d="M14.5 14.5L19 19"></path></g></svg>
</sc-if>
<sc-if value="{{isWrite}}" hint-placeholder-val="{{ false }}">
<svg class="te-write" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L15.5 5.5a2.1 2.1 0 0 1 3 3L8 19z"></path><path d="M13.5 7.5l3 3"></path></svg>
</sc-if>
<sc-if value="{{isCount}}" hint-placeholder-val="{{ false }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect class="te-bar1" x="4" y="10" width="3.2" height="10" rx="1"></rect><rect class="te-bar2" x="10.4" y="6" width="3.2" height="14" rx="1"></rect><rect class="te-bar3" x="16.8" y="3" width="3.2" height="17" rx="1"></rect></svg>
</sc-if>
<sc-if value="{{isClock}}" hint-placeholder-val="{{ false }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path class="te-hand" d="M12 12V7"></path><path d="M12 12l3 1.5"></path></svg>
</sc-if>
<sc-if value="{{isCheck}}" hint-placeholder-val="{{ false }}">
<svg class="te-pulse" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.2-3 7.4-7 9-4-1.6-7-4.8-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
</sc-if>
<sc-if value="{{isCopy}}" hint-placeholder-val="{{ false }}">
<svg class="te-bob" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
</sc-if>
</span>
<span class="te-shimmer" style="font-size: 15px; font-weight: 500">{{current}}</span>
</div>
<div style="padding-left: 30px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--faint, #6E6A5F)">{{counter}}</div>
</div>
</sc-if>
<sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; flex-direction: column; gap: 10px; color: var(--amber, #8A4B00); background: var(--amber-soft, #FBEEDD); border-radius: 12px; padding: 10px 12px">
<div style="display: flex; align-items: flex-start; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3.5l9.5 16.5h-19z"></path><path d="M12 10v4.5M12 17.5v.5"></path></svg><span style="font-size: 14px; line-height: 1.45"><span style="font-weight: 600">Stopped at: {{current}}.</span> {{fail}}</span></div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; padding-left: 30px"><button onClick="{{retry}}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--amber-line, #E3C08F); background: var(--raised, #FFFFFF); color: var(--ink, #17160F); font-size: 14px; font-weight: 600; cursor: pointer">Try again</button><button onClick="{{cancel}}" style="min-height: 44px; padding: 0 4px; border: none; background: none; color: var(--blue, #2340A8); font-size: 14px; font-weight: 500; cursor: pointer">Cancel</button></div>
</div>
</sc-if>
<sc-if value="{{isNeeds}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; flex-direction: column; gap: 10px; color: var(--amber, #8A4B00); background: var(--amber-soft, #FBEEDD); border-radius: 12px; padding: 10px 12px">
<div style="display: flex; align-items: flex-start; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4M12 17v.5"></path></svg><span style="font-size: 14px; line-height: 1.45"><span style="font-weight: 600">Needs you.</span> {{ask}}</span></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap; padding-left: 30px"><button onClick="{{chooseA}}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--amber-line, #E3C08F); background: var(--raised, #FFFFFF); color: var(--ink, #17160F); font-size: 14px; font-weight: 600; cursor: pointer">{{ansA}}</button><button onClick="{{chooseB}}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--amber-line, #E3C08F); background: var(--raised, #FFFFFF); color: var(--ink, #17160F); font-size: 14px; font-weight: 600; cursor: pointer">{{ansB}}</button></div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cmd":{"editor":"enum","options":["next","draft","ready","find","posted","record","ask","results"],"default":"draft"},"loop":{"editor":"boolean","default":false},"show":{"editor":"enum","options":["live","error","needs"],"default":"live"},"fail":{"editor":"string","default":""},"failAt":{"editor":"string","default":""},"ask":{"editor":"string","default":""},"ansA":{"editor":"string","default":"Yes"},"ansB":{"editor":"string","default":"Not now"},"onDone":{"editor":null},"onRetry":{"editor":null},"onCancel":{"editor":null},"$preview":{"width":360,"height":150}}'>
const STEPS = {
  next: [
    { t: 'Running the daily snapshot', k: 'sync' },
    { t: 'Reading the loop status', k: 'read' },
    { t: 'Searching X for questions on your topic', k: 'search' },
    { t: 'Checking the queue and your last post', k: 'read' },
    { t: 'Picking the time slot', k: 'clock' }
  ],
  draft: [
    { t: 'Reading the PAID → FREE rules', k: 'read' },
    { t: 'Checking the paid tools’ pricing pages', k: 'search' },
    { t: 'Reading the free tools’ own docs', k: 'search' },
    { t: 'Writing the claims table', k: 'write' },
    { t: 'Counting characters as X does', k: 'count' }
  ],
  ready: [
    { t: 'Checking the cards match your approval', k: 'check' },
    { t: 'Running the final checks', k: 'check' },
    { t: 'Writing the run sheet', k: 'write' }
  ],
  find: [
    { t: 'Reading your latest posts from X', k: 'sync' },
    { t: 'Matching it to your approved cards', k: 'check' }
  ],
  posted: [
    { t: 'Watching for your shout-out on X', k: 'sync' },
    { t: 'Recording the post and the shout-out', k: 'write' },
    { t: 'Opening the first-hour card', k: 'clock' }
  ],
  record: [
    { t: 'Recording the post', k: 'write' },
    { t: 'Opening the first-hour card', k: 'clock' }
  ],
  ask: [
    { t: 'Reading your weights and posts', k: 'read' },
    { t: 'Checking the X ranking notes', k: 'search' },
    { t: 'Writing an answer', k: 'write' }
  ],
  results: [
    { t: 'Reading this week’s snapshots', k: 'sync' },
    { t: 'Grouping your replies by topic', k: 'count' },
    { t: 'Checking the rewards numbers', k: 'count' },
    { t: 'Writing the weekly review', k: 'write' }
  ]
};

class Component extends DCLogic {
  steps() {
    return STEPS[this.props.cmd] || STEPS.draft;
  }

  looping() {
    return this.props.loop ?? !this.props.onDone;
  }

  componentDidMount() {
    if (this.props.show === 'error' || this.props.show === 'needs') { this.setState({ i: this.props.show === 'error' ? this.failAt() : this.steps().length - 1, ended: this.props.show }); return; }
    this.start();
  }

  failAt() {
    const n = this.steps().length, f = parseInt(this.props.failAt, 10);
    return isNaN(f) ? n - 1 : Math.min(Math.max(f, 0), n - 1);
  }

  start() {
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      const n = this.steps().length;
      const i = (this.state && this.state.i) || 0;
      if (this.props.fail && i >= this.failAt()) { clearInterval(this.timer); this.setState({ ended: 'error' }); return; }
      if (i < n - 1) {
        this.setState({ i: i + 1 });
        return;
      }
      if (this.looping()) {
        this.setState({ i: 0 });
        return;
      }
      clearInterval(this.timer);
      if (this.props.fail) { this.setState({ ended: 'error' }); return; }
      if (this.props.ask) { this.setState({ ended: 'needs' }); return; }
      const done = this.props.onDone;
      if (done) this.doneTimer = setTimeout(() => done(), 500);
    }, 1500);
  }

  finish(handler) {
    if (handler) handler();
    this.setState({ ended: 'done' });
    const done = this.props.onDone;
    if (done) done();
  }

  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.doneTimer);
  }

  renderVals() {
    const s = this.steps();
    const i = Math.min((this.state && this.state.i) || 0, s.length - 1);
    const k = s[i].k;
    const ended = this.state && this.state.ended;
    return {
      running: !ended || ended === 'done',
      isError: ended === 'error', isNeeds: ended === 'needs',
      fail: this.props.fail || 'The command stopped before it finished. Nothing was changed.',
      ask: this.props.ask || 'This command needs an answer before it goes on.',
      ansA: this.props.ansA || 'Yes', ansB: this.props.ansB || 'Not now',
      retry: () => { if (this.props.onRetry) this.props.onRetry(); this.setState({ i: 0, ended: null }); this.start(); },
      cancel: () => { if (this.props.onCancel) this.props.onCancel(); },
      chooseA: () => this.finish(this.props.onA),
      chooseB: () => this.finish(this.props.onB),
      done: s.slice(0, i).map((x) => ({ text: x.t })),
      current: s[i].t,
      counter: 'Step ' + (i + 1) + ' of ' + s.length,
      isSync: k === 'sync',
      isRead: k === 'read',
      isSearch: k === 'search',
      isWrite: k === 'write',
      isCount: k === 'count',
      isClock: k === 'clock',
      isCheck: k === 'check',
      isCopy: k === 'copy'
    };
  }
}
</script>
</body>
</html>
